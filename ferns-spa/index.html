<title>Fern's Spa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen salon. Stage (customer + place) beside a tool panel in landscape, stacked in portrait. */
:root{
  --bg:#fde7f1; --ink:#4a2343; --soft:#8b5a80; --card:#ffffff; --line:#f3c6dc;
  --pink:#ff4f9a; --pinkdk:#d92f7a; --mint:#3fcfa4; --gold:#f5b921; --lav:#ece1ff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--pinkdk);margin-right:auto;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:1rem}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,#f5b921 60%,#c98a00);display:inline-block;box-shadow:inset 0 -2px 0 #b07800;flex:none}
.coins b{font-variant-numeric:tabular-nums;font-size:1.15rem}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.tbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:1rem}
.tbtn:active{transform:scale(.95)}
.tbtn.hot{background:var(--pink);border-color:var(--pinkdk);color:#fff}
.play{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
@media (orientation:portrait){.play{grid-template-columns:1fr;grid-template-rows:44% 1fr}}
.stage{container-type:size;position:relative;border-radius:26px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 var(--line);min-height:0}
.stage>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.cust{position:absolute;left:50%;bottom:0;height:80%;height:min(86cqh,85cqw);transform:translateX(-50%);aspect-ratio:300/340}
.cust svg{width:100%;height:100%;display:block}
.cust.body{height:84%;height:84cqh;aspect-ratio:300/720;bottom:1%}
.cust.hand{height:80%;height:min(84cqh,90cqw);aspect-ratio:400/430}
.arrive{animation:arrive .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes arrive{from{transform:translateX(60%);opacity:0}}
.team{position:absolute;left:4px;bottom:1%;height:40%;display:flex;align-items:flex-end;z-index:3;pointer-events:none}
.team.many{height:32%}
.me,.helpers div{height:100%;aspect-ratio:300/720;position:relative;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.me svg{width:100%;height:100%}
.me span{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--pink);color:#fff;border-radius:999px;padding:1px 9px;font-size:.8rem}
.queue{position:absolute;right:8px;top:8px;display:flex;align-items:flex-end;gap:2px;background:rgba(255,255,255,.75);border-radius:14px;padding:4px 6px;z-index:2}
.queue small{font-size:.7rem;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--soft)}
.queue div{height:70px;aspect-ratio:300/720}.queue svg{width:100%;height:100%}
.helpers{display:contents}.helpers svg{width:100%;height:100%}
.helpers span{position:absolute;top:-6px;white-space:nowrap;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:0 6px;font-size:.7rem}
.helpers b{position:absolute;right:-2px;bottom:6px;font-size:1.1rem}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:84px;background:#fff;border:3px solid #fff;border-radius:14px;padding:6px 6px;font-size:.85rem;display:flex;align-items:center;gap:5px;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.step b{background:var(--lav);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.75rem;flex:none}
.step.on{border-color:var(--pinkdk)}
.step.ok b{background:var(--mint);color:#fff}
.cust.rub{touch-action:none;cursor:crosshair}
.foam{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#eaf6ff 60%,#bfe3ff);transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.6);pointer-events:none;animation:pop .3s}
.cust.body .foam{width:16%}
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#6cc4ff;pointer-events:none;animation:fall .6s forwards}
@keyframes fall{to{transform:translateY(60px);opacity:0}}
.soak{position:absolute;left:5%;right:5%;bottom:-4%;height:55%;border-radius:0 0 50% 50%/0 0 40% 40%;background:rgba(120,200,255,.55);border-top:6px solid rgba(255,255,255,.8);animation:soak 2.2s forwards;pointer-events:none}
@keyframes soak{0%{transform:translateY(100%)}25%,75%{transform:translateY(0)}100%{transform:translateY(100%)}}
.lamp{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(190,120,255,.65),rgba(190,120,255,0) 70%);animation:lamp 2.2s forwards;pointer-events:none}
@keyframes lamp{0%,100%{opacity:0}20%,80%{opacity:1}}
.moodrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.moodrow span{font-size:1.5rem;line-height:1}
.moodbar{flex:1;min-width:80px;height:14px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid #fff}
.moodbar i{display:block;height:100%;border-radius:999px;transition:width .5s,background .5s}
.needbtn{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.tile.care .ce{font-size:2.2rem;line-height:1.2}
.tile.care{min-height:84px;justify-content:center}
.thought{position:absolute;left:24%;top:30%;background:#fff;border-radius:50%;width:64px;height:64px;display:grid;place-items:center;font-size:2rem;box-shadow:0 4px 0 rgba(0,0,0,.08);z-index:3;animation:pulse 2s infinite}
.thought:after{content:"";position:absolute;right:-8px;bottom:-6px;width:16px;height:16px;border-radius:50%;background:#fff}
.mess{position:absolute;width:56px;height:34px;border:0;background:none;padding:0;z-index:2}
.mess svg{width:100%;height:100%}
@media (max-width:820px){.tbtn{padding:7px 10px;font-size:.9rem}.pill{padding:5px 9px}.brand{font-size:1.25rem}.top{flex-wrap:nowrap}}
.bubble{position:absolute;top:10px;left:10px;background:#fff;border-radius:20px;padding:10px 16px;font-size:1.05rem;max-width:58%;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08);z-index:3}
.bubble:after{content:"";position:absolute;bottom:-10px;left:60%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.view{position:absolute;right:10px;top:94px;display:flex;flex-direction:column;gap:8px;z-index:3}
.view button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;font-size:.9rem}
.view button.on{background:var(--pink);color:#fff;border-color:var(--pinkdk)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fx i{position:absolute;font-style:normal;animation:float 1.6s ease-out forwards}
@keyframes float{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-140px) scale(1.2);opacity:0}}
.panel{background:var(--card);border-radius:26px;border:3px solid #fff;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.order{background:var(--lav);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.order h3{margin:0;font-family:var(--display);font-size:1.1rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 10px 4px 5px;font-size:.88rem;border:2px solid transparent}
.chip.ok{border-color:var(--mint);background:#e4fbf3}
.chip .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:#fff}
.chip.ok .ck{background:var(--mint);border-color:var(--mint)}
.sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;overflow-x:auto}
.tab{flex:1;min-width:64px;border:0;background:#fff3f8;border-radius:16px 16px 0 0;padding:8px 4px;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .e{font-size:1.4rem;line-height:1}
.tab.on{background:#ffd9ea;color:var(--pinkdk)}
.tools{flex:1;overflow-y:auto;background:#ffd9ea;padding:10px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.row h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:1rem}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.1);position:relative}
.swb.sel{outline:4px solid var(--pinkdk);outline-offset:2px}
.swb.none{background:#fff!important}
.swb.none:after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;background:#e06;transform:rotate(-45deg);border-radius:2px}
.tile{width:76px;background:#fff;border:3px solid #fff;border-radius:18px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tile svg{width:62px;height:62px}
.tile.sel{border-color:var(--pinkdk)}
.tile.shop{justify-content:center;background:#fff7d6;color:#8a6400;min-height:84px}
.hint{font-size:.9rem;color:var(--soft);margin:0}
.act{display:flex;gap:8px;flex-wrap:wrap}
.abtn{background:#fff;border:3px solid #fff;border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08);font-size:.95rem}
.abtn:active,.tile:active,.swb:active{transform:scale(.94)}
.foot{padding:10px 12px;background:#fff}
.done{width:100%;border:0;border-radius:20px;padding:14px;font-family:var(--display);font-size:1.4rem;font-weight:700;color:#fff;background:linear-gradient(#ff6aac,#ff3d8c);box-shadow:0 5px 0 var(--pinkdk)}
.done:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkdk)}
.ov{position:fixed;inset:0;background:rgba(74,35,67,.45);display:grid;place-items:center;z-index:20;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));box-sizing:border-box}
.box{background:#fff;border-radius:28px;width:min(720px,100%);max-height:100%;overflow-y:auto;padding:18px 18px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.box h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.7rem;color:var(--pinkdk);text-align:center;text-wrap:balance}
.box .sub{margin:-8px 0 0;text-align:center;color:var(--soft)}
.big{border:0;border-radius:20px;padding:14px 22px;font-family:var(--display);font-size:1.3rem;font-weight:700;color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pinkdk);align-self:center}
.big.alt{background:#fff;color:var(--pinkdk);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.sec{background:#fff3f8;border-radius:20px;padding:12px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.place{border:4px solid #fff;border-radius:18px;padding:0;overflow:hidden;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08);position:relative}
.place svg{display:block;width:100%;height:90px}
.place span{display:block;padding:6px;font-size:.95rem}
.place.sel{border-color:var(--pinkdk)}
.place .lock{position:absolute;inset:0 0 auto 0;height:90px;background:rgba(40,20,50,.45);display:grid;place-items:center;color:#fff;font-size:1rem}
.price{display:flex;align-items:center;gap:4px;justify-content:center;font-size:.85rem}
.price .coin{width:16px;height:16px}
.owned{color:var(--mint);font-size:.8rem}
.res{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.res .b{width:min(240px,55%)}.res .b.p{width:auto;height:min(46vh,360px);aspect-ratio:300/720}.res .b.p svg{height:100%;width:100%}
.res .h{width:min(150px,32%)}
.stars{text-align:center;font-size:2.6rem;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0)}}
.earn{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--display);font-size:1.6rem;color:#a06d00}
.name-in{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:14px;border:3px solid var(--line);width:100%;box-sizing:border-box;color:var(--ink);background:#fff}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.blink{animation:blink 4.5s infinite;transform-origin:150px 160px;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:30;font-size:1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app"></div>

<script>
// ---------- data ----------
const P={
  nail:{red:'#e8344e',pink:'#ff7eb6',blue:'#3a86ff',purple:'#9b5de5',mint:'#4fd8b0',gold:'#f2c230',orange:'#ff8c3a',black:'#2b2433',white:'#fbfbff'},
  hair:{brown:'#6b4226',black:'#2a1f1c',blonde:'#f0cc6a',red:'#c4532c',pink:'#ff86c3',blue:'#4f9dff',purple:'#9f7aea',green:'#45c99a'},
  lips:{pink:'#ff5fa2',red:'#d7263d',coral:'#ff7f5c',purple:'#8e44ad',berry:'#a4134d'},
  eyes:{blue:'#5aa9ff',purple:'#b07cff',pink:'#ff8fc8',gold:'#f4c430',green:'#4fd1a1'},
  blush:{pink:'#ff8fab',peach:'#ffab76',rose:'#e86a8a'},
  cloth:{pink:'#ff8cc6',blue:'#4f9dff',purple:'#9b6cf0',yellow:'#ffd34d',red:'#e8344e',mint:'#52d6ae',black:'#2f2a3a',white:'#f4f4fa'}
};
const SKINS=['#fbe0cc','#f1c3a0','#d9a07a','#b0764f','#8a5536','#5f3a25'];
const CAT=[
 {k:'nailColor',t:'Nail polish',pal:'nail',items:{red:0,pink:0,blue:0,purple:0,mint:15,orange:15,white:15,gold:20,black:20}},
 {k:'nailDesign',t:'Nail designs',items:{plain:0,dots:0,stripes:0,hearts:20,stars:25,sparkles:30}},
 {k:'hairStyle',t:'Hairstyles',items:{long:0,bob:0,ponytail:0,short:0,spiky:0,buns:20,curly:20,braids:25}},
 {k:'hairColor',t:'Hair dye',pal:'hair',items:{brown:0,black:0,blonde:0,red:0,pink:15,blue:15,purple:15,green:20}},
 {k:'lips',t:'Lipstick',pal:'lips',items:{none:0,pink:0,red:0,coral:15,purple:20,berry:20}},
 {k:'eyes',t:'Eyeshadow',pal:'eyes',items:{none:0,blue:0,purple:0,pink:15,green:15,gold:20}},
 {k:'blush',t:'Blush',pal:'blush',items:{none:0,pink:0,peach:15,rose:15}},
 {k:'outfit',t:'Clothes',items:{tshirt:0,dress:0,hoodie:20,jacket:25,sparkly:30,gown:50}},
 {k:'outfitColor',t:'Clothes colors',pal:'cloth',items:{pink:0,blue:0,purple:0,yellow:0,red:10,mint:10,white:10,black:15}},
 {k:'extra',t:'Extras',items:{none:0,bow:0,flower:0,headband:15,earrings:20,glasses:25,crown:40}},
 {k:'loc',t:'Salon places',items:{beach:0,city:0,forest:0,candy:0,space:60,ocean:80,castle:100}}
];
const CATK=Object.fromEntries(CAT.map(c=>[c.k,c]));
const LBL={long:'Long',short:'Short',spiky:'Spiky',bob:'Bob',ponytail:'Ponytail',buns:'Space buns',curly:'Curly puffs',braids:'Braids',tshirt:'T-shirt',dress:'Dress',hoodie:'Hoodie',sparkly:'Sparkle top',jacket:'Jacket',gown:'Princess gown',none:'None',bow:'Bow',flower:'Flower',headband:'Headband',earrings:'Earrings',glasses:'Sunglasses',crown:'Crown',plain:'Plain',dots:'Dots',stripes:'Stripes',hearts:'Hearts',stars:'Stars',sparkles:'Glitter',beach:'Beach',city:'Big City',forest:'Forest',candy:'Candy Land',space:'Outer Space',ocean:'Under the Sea',castle:'Castle'};
const SPA={manicure:['🫧','Soak & file nails'],shine:['✨','Top coat & dryer'],wash:['🧴','Wash & dry hair'],facial:['🥒','Face mask']};
const CARE={drink:['💧','Glass of water'],tea:['☕','Warm tea'],snack:['🍪','Cookie'],blanket:['🧣','Cozy blanket'],magazine:['📖','Magazine'],music:['🎵','Calm music'],talk:['💬','Kind words'],tissue:['🤧','Tissue']};
const FEEL=[
 {k:'sad',need:'talk',say:"I had a really bad day...",fix:"Thank you. That made me feel so much better."},
 {k:'thirsty',need:'drink',say:"I'm sooo thirsty. I walked here in the hot sun!",fix:"Ahh, that's better! Thank you!"},
 {k:'hungry',need:'snack',say:"My tummy is rumbling. I missed lunch.",fix:"Yum! My tummy says thank you!"},
 {k:'tired',need:'tea',say:"I'm so tired. I worked all night.",fix:"Mmm, warm tea. I feel awake now!"},
 {k:'cold',need:'blanket',say:"Brrr! It's freezing outside!",fix:"So cozy and warm. Thank you!"},
 {k:'nervous',need:'music',say:"I'm nervous. I have a big show tonight!",fix:"This music helps me feel calm."},
 {k:'bored',need:'magazine',say:"Waiting in line was soooo boring.",fix:"Ooh, this magazine is fun!"},
 {k:'sniffly',need:'tissue',say:"Achoo! I have the sniffles.",fix:"Thanks! Much better."}];
const KIND=["You're going to look amazing!","I'm so glad you came in today.","You have a great smile!","Everything's going to be okay.","You're super cool!"];
const KEYWORD={manicure:'Spa',shine:'Spa',wash:'Spa',facial:'Spa',nailColor:'Nails',nailDesign:'Nail art',hairStyle:'Hair',hairColor:'Hair color',lips:'Lips',eyes:'Eyes',blush:'Cheeks',outfit:'Clothes',outfitColor:'Clothes color',extra:'Extra'};
const NAMES=['Mia','Zoe','Lily','Ava','Ruby','Luna','Maya','Priya','Sofia','Nora','Jade','Olivia','Emma','Aisha','Chloe','Hana','Grandma Rose','Ms. Lopez','Isla','Bella','Kiko','Daisy','Amara','Ellie','Fatima','Penny'];
const BOYS=['Leo','Max','Sam','Omar','Jayden','Theo','Kenji','Mateo','Eli','Noah','Grandpa Joe','Mr. Park','Ravi','Finn','Malik','Oscar','Luca','Ben','Tomas','Ezra'];
const GIRL_ONLY=['dress','gown','bow','flower','lips','eyes','blush'];
const HELP={cleaner:{name:'Sam',job:'Sweeps up messes for you',price:40,look:{skin:'#d9a07a',hairStyle:'short',hairColor:'black',outfit:'tshirt',outfitColor:'mint',boy:1}},
  desk:{name:'Kai',job:'Front desk: +3 coins every customer',price:60,look:{skin:'#f1c3a0',hairStyle:'bob',hairColor:'red',outfit:'jacket',outfitColor:'blue'}},
  dj:{name:'Lulu',job:'Plays music: happy customers give +2 coins',price:50,look:{skin:'#8a5536',hairStyle:'curly',hairColor:'pink',outfit:'hoodie',outfitColor:'purple',extra:'glasses'}}};
const HELLO=['Hi! Can you make me look like this?','Hello! I have a party today!','Hi hi! I want to look super fancy!','Hello! My friend said your salon is the best!','Hi! Here is what I want, please!'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const lbl=s=>SPA[s]?SPA[s][1]:LBL[s]||cap(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}

// ---------- save ----------
const KEY='sparkle-salon-v1';
function freshSave(){const u={};CAT.forEach(c=>{u[c.k]=Object.keys(c.items).filter(i=>c.items[i]===0)});
  return {coins:0,served:0,unlocked:u,loc:'city',salon:"Fern's Spa",helpers:[],mess:[],queue:[],me:{skin:SKINS[1],hairStyle:'ponytail',hairColor:'brown',outfit:'dress',outfitColor:'purple',extra:'bow',lips:'pink',eyes:'none',blush:'pink'},setup:false,cust:null,sound:true}}

// ---------- effects ----------
function burst(chars,n=10){const fx=$('#fx');if(!fx)return;for(let i=0;i<n;i++){const e=document.createElement('i');e.textContent=rnd(chars);e.style.left=(20+Math.random()*60)+'%';e.style.top=(30+Math.random()*50)+'%';e.style.fontSize=(18+Math.random()*22)+'px';e.style.animationDelay=(Math.random()*.6)+'s';fx.appendChild(e);setTimeout(()=>e.remove(),2400)}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function say(t){UI.bubble=t;clearTimeout(say.t);say.t=setTimeout(()=>{UI.bubble='';const b=$('.bubble');if(b)b.remove()},4000)}
const LIKES=['Ooh, pretty!','I like that!','So sparkly!','Wow!','Cute!','Yay!'];

// ---------- actions ----------
function startCustomer(){UI.hairTool=null;UI.anim=null;fillQueue();S.cust=makeOrder(S.queue.shift());fillQueue();UI.tab='nails';UI.view='hands';UI.arrive=true;UI.tool={t:'c',v:S.unlocked.nailColor[0]};const fe=feelOf(S.cust);if(fe){UI.tab='care';UI.view='body';say(`I'm ${S.cust.name}. ${fe.say}`)}else say(`I'm ${S.cust.name}. ${S.cust.hello}`);save();render()}
function finish(){
  const C=S.cust,list=Object.entries(C.order).map(([k,v])=>[k,v,matched(C,k)]),good=list.filter(x=>x[2]).length;
  const stars=good===list.length?3:good>=list.length/2?2:1,tip=stars===3?10:0,messy=(S.mess||[]).length>=3;
  const mood=C.mood==null?60:C.mood,mb=mood>=80?5:mood<35?-3:0;
  let pay=good*5+tip+2+mb+(has2('desk')?3:0)+(has2('dj')?2:0)-(messy?3:0);pay=Math.max(1,pay);
  const say=stars===3?rnd(['I LOVE it! Thank you!','This is perfect!','I look amazing!']):stars===2?rnd(['So pretty! Almost just right.','I like it a lot!']):'Thank you! Next time, maybe the things I asked for?';
  S.coins+=pay;S.served++;S.mess=S.mess||[];const sp=[{t:'hair',c:P.hair[C.look.hairColor]}];if(C.nails.some(n=>n.c))sp.push({t:'spill',c:P.nail[C.nails.find(n=>n.c).c]});sp.forEach(m=>{if(S.mess.length<7)S.mess.push(Object.assign(m,{x:Math.round(18+Math.random()*58),y:Math.round(2+Math.random()*10)}))});
  UI.result={stars,list,pay,tip,say,messy,mood,mb};UI.ov='result';save();render();
  stars===3?sfx.sparkle():sfx.coin();
}
document.addEventListener('click',e=>{
  const nail=e.target.closest('[data-nail]');
  if(nail&&S.cust&&!UI.ov&&nail.closest('#cust')){const i=+nail.dataset.nail,n=S.cust.nails[i];
    const t=UI.tool.t;
    if(t==='file'){if(n.len>0){n.len--;tone(300+Math.random()*80,.12,'sawtooth',.05);tone(340,.1,'sawtooth',.04,.1)}else{say('That nail is already short!')}}
    else if(t==='top'){n.top=true;n.dry=false;sfx.paint()}
    else{if(t==='c')n.c=UI.tool.v;else n.d=UI.tool.v;n.dry=false;sfx.paint()}
    bumpMood(2);save();render();if(Math.random()<.25)say(rnd(LIKES)),render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,k=b.dataset.k,C=S.cust;
  if(a)sfx.tap();
  if(a==='tab'){UI.tab=v;UI.hairTool=null;UI.view=v==='nails'?'hands':v==='care'?'body':v==='makeup'?'face':'body';render()}
  else if(a==='view'){UI.view=v;render()}
  else if(a==='tool'){UI.tool={t:b.dataset.t,v};UI.view='hands';render()}
  else if(a==='allnails'){const t=UI.tool.t;C.nails.forEach(n=>{if(t==='file')n.len=0;else if(t==='top'){n.top=true;n.dry=false}else{t==='c'?n.c=UI.tool.v:n.d=UI.tool.v;n.dry=false}});UI.view='hands';sfx.paint();save();render();burst(['✨','💖'],6)}
  else if(a==='remover'){C.nails.forEach(n=>{n.c=null;n.d='plain';n.top=false;n.dry=false});UI.view='hands';save();render()}
  else if(a==='set'){C.look[k]=v;bumpMood(3);UI.view=UI.tab==='makeup'?'face':'body';save();if(Math.random()<.35)say(rnd(LIKES));render();burst(['✨'],4)}
  else if(a==='care'){const f=feelOf(C);
    if(C.need&&v===C.need){C.need=null;bumpMood(45);say(f.fix);sfx.sparkle();render();burst(['💖','✨'],10)}
    else if(v==='talk'){bumpMood(6);say(rnd(KIND).replace(/^/,'You: ')) ;render();burst(['💖'],3)}
    else{bumpMood(4);say(C.need?`Thanks! But... ${f.say}`:'Thank you, that\'s so nice!');render()}
    save()}
  else if(a==='soak'){UI.view='hands';UI.anim='soak';render();sfx.bubble();setTimeout(()=>{C.nails.forEach(n=>n.dirty=false);UI.anim=null;save();render();say('Ahh, nice warm water!');render()},2200)}
  else if(a==='lamp'){UI.view='hands';UI.anim='lamp';render();tone(220,1.6,'sine',.05);setTimeout(()=>{C.nails.forEach(n=>{if(n.c||n.top)n.dry=true});UI.anim=null;save();render();burst(['✨'],6)},2200)}
  else if(a==='htool'){UI.hairTool=UI.hairTool===v?null:v;UI.view='face';render()}
  else if(a==='mask'){if(!C.look.mask){C.look.mask=true;UI.view='face';say('Ooh, cool and relaxing!')}else{C.look.mask=false;C.spa=C.spa||{};C.spa.facial=true;say('My skin feels so soft!');setTimeout(()=>burst(['✨','💖'],8),50)}save();render()}
  else if(a==='wash'){UI.view='body';render();sfx.bubble();burst(['🫧','🫧','💧'],16);say('Ahh, bubbly!');setTimeout(render,50)}
  else if(a==='dry'){UI.view='body';render();burst(['💨','✨'],10);say('So warm and fluffy!');setTimeout(render,50)}
  else if(a==='done'){finish()}
  else if(a==='next'){UI.ov=null;startCustomer()}
  else if(a==='ov'){if(v==='setup2'||v==='places'){}UI.ov=v;render()}
  else if(a==='close'){readName();UI.ov=null;save();render()}
  else if(a==='open'){readName();S.setup=true;UI.ov=null;save();if(!S.cust)startCustomer();else render()}
  else if(a==='me'){S.me[k]=v;save();keepScroll(render)}
  else if(a==='loc'){readName();S.loc=v;S.queue=(S.queue||[]).slice(0,qSize());fillQueue();save();keepScroll(render)}
  else if(a==='buy'){const price=CATK[k].items[v];
    if(S.coins>=price){S.coins-=price;S.unlocked[k].push(v);if(k==='loc')S.loc=v;save();sfx.sparkle();keepScroll(render);toast(`You got ${lbl(v)}!`)}
    else{sfx.no();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);toast(`You need ${price-S.coins} more coins`)}}
  else if(a==='hire'){const H=HELP[v];if(S.coins>=H.price){S.coins-=H.price;S.helpers.push(v);save();sfx.sparkle();keepScroll(render);toast(`${H.name} joined your team!`)}
    else{sfx.no();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);toast(`You need ${H.price-S.coins} more coins`)}}
  else if(a==='clean'){S.mess.splice(+v,1);save();render();burst(['✨','🧹'],4)}
  else if(a==='closeshop'){S.closed=true;UI.bubble='';save();UI.ov='closed';render()}
  else if(a==='openshop'){S.closed=false;UI.ov=null;save();sfx.sparkle();if(S.cust){UI.arrive=true;say(`Yay, you're open! I'm ${S.cust.name}.`)}render()}
  else if(a==='sound'){S.sound=!S.sound;save();render()}
});
let lastRub=null;
function rub(e){
  if(!UI.hairTool||UI.ov||!S.cust)return;const cu=$('#cust');if(!cu||UI.view==='hands')return;
  const r=cu.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
  if(x<0||x>100||y<0||y>100)return;
  if(lastRub&&Math.hypot(e.clientX-lastRub[0],e.clientY-lastRub[1])<14)return;lastRub=[e.clientX,e.clientY];
  const C=S.cust,sp=C.spa=C.spa||{};C.foam=C.foam||[];const fx=$('#fx');
  const hairY=UI.view==='face'?60:22;if(y>hairY){return}
  if(UI.hairTool==='shampoo'){if(C.foam.length<26){C.foam.push({x:Math.round(x),y:Math.round(y)});const f=document.createElement('i');f.className='foam';f.style.left=x+'%';f.style.top=y+'%';cu.appendChild(f);tone(500+Math.random()*500,.06,'sine',.05)}
    if(C.foam.length>=14&&!sp.shampoo){sp.shampoo=true;C.look.messy=false;save();say('So bubbly!');render();}}
  else if(UI.hairTool==='rinse'){const before=C.foam.length;C.foam=C.foam.filter(f=>Math.hypot(f.x-x,f.y-y)>14);
    const d=document.createElement('i');d.className='drop';d.style.left=(e.clientX-$('#stage').getBoundingClientRect().left)+'px';d.style.top=(e.clientY-$('#stage').getBoundingClientRect().top)+'px';fx&&fx.appendChild(d);setTimeout(()=>d.remove(),700);
    tone(900+Math.random()*300,.04,'triangle',.03);
    if(C.foam.length!==before){if(!C.foam.length&&sp.shampoo){sp.rinsed=true;C.look.wet=true;say('All rinsed! Now dry it.');}save();render()}}
  else if(UI.hairTool==='dryer'){sp.dry=(sp.dry||0)+1;tone(150+Math.random()*40,.08,'sawtooth',.03);
    if(fx&&Math.random()<.4){const w=document.createElement('i');w.textContent='💨';w.style.left=x+'%';w.style.top=y+'%';fx.appendChild(w);setTimeout(()=>w.remove(),1500)}
    if(sp.dry>=30&&C.look.wet){C.look.wet=false;C.look.messy=false;if(sp.rinsed)sp.washed=true;save();say('So soft and fluffy!');render();burst(['✨'],6)}}
}
document.addEventListener('pointerdown',e=>{lastRub=null;rub(e)});
document.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')rub(e)});
function readName(){const i=$('#salonName');if(i){S.salon=i.value.trim()||"Fern's Spa"}}
function keepScroll(fn){const bx=$('.box'),y=bx?bx.scrollTop:0,name=$('#salonName')&&$('#salonName').value;fn();const nb=$('.box');if(nb)nb.scrollTop=y;if(name!=null&&$('#salonName'))$('#salonName').value=name}

// ---------- boot ----------
function start(){ if(S.setup&&S.closed){UI.ov='closed';render();return} if(S.setup&&!S.cust)startCustomer();else{ if(S.cust)say(`Hi again! I'm ${S.cust.name}.`);render()} }
setInterval(()=>{if(UI.ov||!S.cust)return;if(has2('cleaner')&&S.mess&&S.mess.length){S.mess.shift();save();render();burst(['🧹','✨'],5)}},7000);
setInterval(()=>{if(UI.ov||!S.cust||S.closed)return;const c=S.cust;if(c.mood==null)return;
  if(c.need&&c.mood>8){if(bumpMood(-2)){render()}if(Math.random()<.12){say(feelOf(c).say);render()}}else if(!c.need&&c.mood>55&&Math.random()<.3){if(bumpMood(-1))render()}save()},3000);
setInterval(()=>{if(UI.ov||!S.cust||!has2('dj'))return;burst(['🎵','🎶'],3)},5000);
start();
</script>
